name: esante-robotik

services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-dev-secret}
      DATABASE_URL: sqlite:////app/var/robotik.db
      CORS_ALLOW_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
      - backend_data:/app/var
    command: ["/app/docker/entrypoint.sh"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/api/test') ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks: [robotik]

  frontend:
    build:
      context: ./frontend
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [robotik]

volumes:
  backend_vendor:
  backend_data:
  frontend_node_modules:

networks:
  robotik:
    driver: bridge
